<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Login - Kedai Sinau</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#E0D9CE",
                        "on-surface": "#1A1A1A",
                        "primary": "#C0392B",
                        "on-background": "#1A1A1A",
                        "surface-bright": "#FAF3E0",
                        "surface": "#ffffff",
                        "background": "#FAF3E0",
                        "outline-variant": "#E0D9CE",
                        "outline": "#1E3A5F",
                        "on-surface-variant": "#1E3A5F",
                        "secondary": "#1E3A5F"
                    },
                    "fontFamily": {
                        "headline-h1": ["Newsreader", "serif"],
                        "display-lg": ["Newsreader", "serif"],
                        "headline-h2": ["Newsreader", "serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-sm": ["Inter", "sans-serif"],
                        "headline-h3": ["Newsreader", "serif"],
                        "caption": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF3E0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }

        .auth-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #1E3A5F;
            padding: 12px 0;
            font-family: 'Newsreader', serif;
            font-size: 18px;
            color: #1A1A1A;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            outline: none;
            border-bottom-color: #C0392B;
            box-shadow: 0 1px 0 0 #C0392B;
        }

        .auth-input::placeholder {
            color: rgba(30, 58, 95, 0.5);
            font-style: italic;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 48px;
            background: #ffffff;
            border: 1px solid #E0D9CE;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: relative;
        }

        /* Subtle decorative corners */
        .auth-container::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            border-top: 1px solid #1E3A5F;
            border-left: 1px solid #1E3A5F;
            opacity: 0.3;
        }

        .auth-container::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-bottom: 1px solid #1E3A5F;
            border-right: 1px solid #1E3A5F;
            opacity: 0.3;
        }
    </style>
</head>

<body class="text-on-surface antialiased">
    <div class="noise-overlay"></div>

    <div class="auth-container flex flex-col items-center">
        <!-- Logo -->
        <div class="text-3xl font-bold text-on-surface font-newsreader tracking-tight mb-2">Kedai Sinau.</div>
        
        <!-- Heading -->
        <h1 class="font-newsreader italic text-on-surface-variant text-lg mb-10 tracking-wider">Admin Panel</h1>

        <!-- Form -->
        <form class="w-full flex flex-col gap-8" onsubmit="event.preventDefault();">
            
            <div class="flex flex-col">
                <label class="font-label-sm text-[10px] uppercase tracking-widest text-on-surface-variant mb-1">Email Address</label>
                <input type="email" class="auth-input" placeholder="curator@kedaisinau.com" required />
            </div>

            <div class="flex flex-col mb-4">
                <label class="font-label-sm text-[10px] uppercase tracking-widest text-on-surface-variant mb-1">Password</label>
                <input type="password" class="auth-input" placeholder="••••••••" required />
            </div>

            <!-- Button -->
            <button type="submit" class="w-full border border-on-surface text-on-surface px-6 py-4 font-newsreader uppercase text-sm tracking-widest hover:bg-on-surface hover:text-white transition-colors duration-500 mt-2">
                Authenticate
            </button>
            
        </form>
    </div>

</body>
</html>
